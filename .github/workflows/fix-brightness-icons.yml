name: Fix brightness icons
on: workflow_dispatch
permissions:
  contents: write
  actions: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Copy icon styles
        run: |
          git config user.name "builder"
          git config user.email "builder@users.noreply.github.com"
          cd patches/src/main/resources/brightnessbutton/drawable
          for n in off on; do
            for s in bold sharp fluent ionicons phosphor phosphor_fill phosphor_light phosphor_duotone; do
              cp morphe_brightness_button_$n.xml morphe_brightness_button_${n}_$s.xml
            done
          done
          ls
          cd ../../../../../..
          git add -A
          git commit -m "fix(YouTube): Add brightness button icon styles [skip ci]"
          git push origin main
      - name: Start Release build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref main
