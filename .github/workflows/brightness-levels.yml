name: Brightness levels final
on: workflow_dispatch
permissions:
  contents: write
  packages: read
jobs:
  pick:
    runs-on: ubuntu-latest
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Add the feature
        run: |
          git config user.name "builder"
          git config user.email "builder@users.noreply.github.com"
          git checkout -b brightness-levels-final
          mkdir -p patches/src/main/resources/brightnessbutton/host/layout

          cat > patches/src/main/resources/brightnessbutton/host/layout/youtube_controls_bottom_ui_container.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <android.support.constraint.ConstraintLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:yt="http://schemas.android.com/apk/res-auto"
              android:id="@+id/youtube_controls_bottom_ui_container"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:layoutDirection="ltr">

              <com.google.android.libraries.youtube.common.ui.TouchImageView
                  android:id="@+id/morphe_brightness_button"
                  style="@style/YouTubePlayerButton"
                  android:layout_width="48.0dip"
                  android:layout_height="60.0dip"
                  android:paddingTop="6.0dp"
                  android:paddingBottom="0dp"
                  android:scaleType="center"
                  android:src="@drawable/morphe_brightness_button_off_bold"
                  yt:layout_constraintBottom_toTopOf="@+id/quick_actions_container"
                  yt:layout_constraintRight_toLeftOf="@+id/fullscreen_button" />

          </android.support.constraint.ConstraintLayout>
          XML

          python3 - <<'PY'
          import os
          d = 'patches/src/main/resources/brightnessbutton/drawable'
          os.makedirs(d, exist_ok=True)
          RAYS8 = 'M12,1.5L12,4M12,20L12,22.5M1.5,12L4,12M20,12L22.5,12M4.6,4.6L6.4,6.4M17.6,17.6L19.4,19.4M4.6,19.4L6.4,17.6M17.6,6.4L19.4,4.6'
          RAYS4 = 'M12,1.5L12,4M12,20L12,22.5M1.5,12L4,12M20,12L22.5,12'
          MOON = 'M11.8075,4.0025A8,8 0 1,0 19.7041,14.1553A6.5,6.5 0 0,1 11.8075,4.0025Z'
          def circle(r):
              return 'M12,12m-%s,0a%s,%s 0 1,0 %s,0a%s,%s 0 1,0 -%s,0' % (r, r, r, 2 * r, r, r, 2 * r)
          def fill(p):
              return '    <path\n        android:fillColor="@android:color/white"\n        android:pathData="' + p + '" />\n'
          def stroke(p):
              return '    <path\n        android:strokeColor="@android:color/white"\n        android:strokeWidth="2"\n        android:strokeLineCap="round"\n        android:pathData="' + p + '" />\n'
          head = '<?xml version="1.0" encoding="utf-8"?>\n<vector xmlns:android="http://schemas.android.com/apk/res/android"\n    android:width="24dp"\n    android:height="24dp"\n    android:viewportWidth="24"\n    android:viewportHeight="24">\n'
          icons = {
              'morphe_brightness_button_off': stroke(circle(5.5)) + stroke(RAYS8),
              'morphe_brightness_button_0': fill(MOON),
              'morphe_brightness_button_25': stroke(circle(5.5)) + fill(circle(1.8)) + stroke(RAYS4),
              'morphe_brightness_button_50': stroke(circle(5.5)) + fill(circle(3.2)) + stroke(RAYS8),
              'morphe_brightness_button_75': stroke(circle(5.5)) + fill(circle(4.4)) + stroke(RAYS8),
              'morphe_brightness_button_100': fill(circle(5.5)) + stroke(RAYS8),
          }
          styles = ['', '_bold', '_sharp', '_fluent', '_ionicons', '_phosphor', '_phosphor_fill', '_phosphor_light', '_phosphor_duotone']
          for name, body in icons.items():
              for s in styles:
                  with open(os.path.join(d, name + s + '.xml'), 'w') as f:
                      f.write(head + body + '</vector>\n')
          print(sorted(os.listdir(d)))
          PY

          cat > patches/src/main/kotlin/app/morphe/patches/youtube/layout/player/buttons/BrightnessButtonPatch.kt <<'KT'
          package app.morphe.patches.youtube.layout.player.buttons

          import app.morphe.patcher.patch.patch
          import app.morphe.patches.shared.misc.settings.preference.SwitchPreference
          import app.morphe.patches.youtube.layout.buttons.overlay.addPlayerOverlayPreferences
          import app.morphe.patches.youtube.layout.buttons.overlay.playerOverlayButtonsSettingsPatch
          import app.morphe.patches.youtube.layout.player.icons.copyPlayerButtonIcons
          import app.morphe.patches.youtube.misc.extension.sharedExtensionPatch
          import app.morphe.patches.youtube.misc.playercontrols.addLegacyBottomControl
          import app.morphe.patches.youtube.misc.playercontrols.initializeLegacyBottomControl
          import app.morphe.patches.youtube.misc.playercontrols.legacyPlayerControlsPatch
          import app.morphe.patches.youtube.misc.settings.settingsPatch
          import app.morphe.patches.youtube.shared.Constants.COMPATIBILITY_YOUTUBE
          import app.morphe.patches.youtube.shared.hookVideoStarted
          import app.morphe.patches.youtube.shared.startVideoInformerPatch

          private const val EXTENSION_BUTTON =
              "Lapp/morphe/extension/youtube/videoplayer/BrightnessButton;"

          private val brightnessButtonResourcePatch = patch {
              dependsOn(
                  settingsPatch,
                  legacyPlayerControlsPatch
              )

              execute {
                  copyPlayerButtonIcons("brightnessbutton", "morphe_brightness_button_off", "morphe_brightness_button_0")
                  copyPlayerButtonIcons("brightnessbutton", "morphe_brightness_button_25", "morphe_brightness_button_50")
                  copyPlayerButtonIcons("brightnessbutton", "morphe_brightness_button_75", "morphe_brightness_button_100")

                  addLegacyBottomControl("brightnessbutton")
              }
          }

          val brightnessButtonPatch = patch(
              name = "Brightness button",
              description = "Adds an option to show a player button that cycles the screen brightness while watching.",
          ) {
              dependsOn(
                  sharedExtensionPatch,
                  settingsPatch,
                  startVideoInformerPatch,
                  playerOverlayButtonsSettingsPatch,
                  playerOverlayButtonsHookPatch,
                  legacyPlayerControlsPatch,
                  brightnessButtonResourcePatch
              )

              compatibleWith(COMPATIBILITY_YOUTUBE)

              execute {
                  addPlayerOverlayPreferences(
                      SwitchPreference("morphe_brightness_button")
                  )

                  addPlayerBottomButton(EXTENSION_BUTTON)
                  initializeLegacyBottomControl(EXTENSION_BUTTON)

                  hookVideoStarted("$EXTENSION_BUTTON->resetBrightnessButton()V")
              }
          }
          KT

          cat > extensions/youtube/src/main/java/app/morphe/extension/youtube/videoplayer/BrightnessButton.java <<'JAVA'
          package app.morphe.extension.youtube.videoplayer;

          import android.app.Activity;
          import android.content.Context;
          import android.content.ContextWrapper;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowManager;
          import android.widget.ImageView;

          import androidx.annotation.Nullable;

          import java.lang.ref.WeakReference;

          import app.morphe.extension.shared.Logger;
          import app.morphe.extension.shared.Utils;
          import app.morphe.extension.youtube.patches.LegacyPlayerControlsPatch;
          import app.morphe.extension.youtube.settings.Settings;

          @SuppressWarnings("unused")
          public class BrightnessButton {

              /**
               * Window brightness set by each tap: 25%, 50%, 75%, 100%, and the lowest level.
               * The lowest level is 1% and not exactly 0, since some devices turn the screen off at 0.
               */
              private static final float[] LEVELS = {0.25f, 0.50f, 0.75f, 1.0f, 0.01f};

              private static final String[] LEVEL_ICONS = {
                      "morphe_brightness_button_25",
                      "morphe_brightness_button_50",
                      "morphe_brightness_button_75",
                      "morphe_brightness_button_100",
                      "morphe_brightness_button_0"
              };

              private static final String SYSTEM_ICON = "morphe_brightness_button_off";

              /** Index of the current level, or -1 while the system brightness is used. */
              private static int level = -1;
              private static float brightnessBeforeChange = WindowManager.LayoutParams.BRIGHTNESS_OVERRIDE_NONE;

              @Nullable
              private static LegacyPlayerControlButton legacy;

              private static WeakReference<ImageView> overlayButtonRef = new WeakReference<>(null);
              private static WeakReference<Activity> activityRef = new WeakReference<>(null);

              /**
               * Injection point.
               */
              public static void initializeButton(View controlsView) {
                  try {
                      if (LegacyPlayerControlsPatch.RESTORE_OLD_PLAYER_BUTTONS
                              || !Settings.BRIGHTNESS_BUTTON.get()) {
                          return;
                      }

                      overlayButtonRef = new WeakReference<>(PlayerOverlayButton.addButton(
                              controlsView,
                              getIconName(),
                              BrightnessButton::onTap,
                              BrightnessButton::onLongPress
                      ));
                  } catch (Exception ex) {
                      Logger.printException(() -> "initializeButton failure", ex);
                  }
              }

              /**
               * Injection point.
               */
              public static void initializeLegacyButton(View controlsView) {
                  try {
                      if (!LegacyPlayerControlsPatch.RESTORE_OLD_PLAYER_BUTTONS) {
                          return;
                      }

                      legacy = new LegacyPlayerControlButton(
                              controlsView,
                              "morphe_brightness_button",
                              null,
                              getIconName(),
                              Settings.BRIGHTNESS_BUTTON,
                              BrightnessButton::onTap,
                              BrightnessButton::onLongPress
                      );
                  } catch (Exception ex) {
                      Logger.printException(() -> "initializeLegacyButton failure", ex);
                  }
              }

              /**
               * Injection point.
               * <p>
               * The brightness is per video, so the system brightness is restored when a new video starts.
               */
              public static void resetBrightnessButton() {
                  if (level < 0) return;

                  Utils.runOnMainThread(() -> {
                      try {
                          restoreSystemBrightness(activityRef.get());
                          updateButtonIcon();
                      } catch (Exception ex) {
                          Logger.printException(() -> "resetBrightnessButton failure", ex);
                      }
                  });
              }

              private static void onTap(View view) {
                  try {
                      Activity activity = findActivity(view.getContext());
                      if (activity == null) {
                          Logger.printDebug(() -> "Brightness button: no activity found");
                          return;
                      }
                      activityRef = new WeakReference<>(activity);

                      if (level < 0) {
                          brightnessBeforeChange = activity.getWindow().getAttributes().screenBrightness;
                      }

                      level = (level + 1) % LEVELS.length;
                      setWindowBrightness(activity, LEVELS[level]);
                      updateButtonIcon();
                  } catch (Exception ex) {
                      Logger.printException(() -> "onTap failure", ex);
                  }
              }

              private static boolean onLongPress(View view) {
                  try {
                      restoreSystemBrightness(findActivity(view.getContext()));
                      updateButtonIcon();
                  } catch (Exception ex) {
                      Logger.printException(() -> "onLongPress failure", ex);
                  }
                  return true;
              }

              private static void restoreSystemBrightness(@Nullable Activity activity) {
                  if (activity != null && level >= 0) {
                      setWindowBrightness(activity, brightnessBeforeChange);
                  }
                  level = -1;
              }

              private static void setWindowBrightness(Activity activity, float brightness) {
                  Window window = activity.getWindow();
                  WindowManager.LayoutParams params = window.getAttributes();
                  params.screenBrightness = brightness;
                  window.setAttributes(params);
              }

              @Nullable
              private static Activity findActivity(Context context) {
                  while (context instanceof ContextWrapper wrapper) {
                      if (wrapper instanceof Activity activity) {
                          return activity;
                      }
                      context = wrapper.getBaseContext();
                  }
                  return null;
              }

              private static void updateButtonIcon() {
                  Utils.verifyOnMainThread();

                  final int icon = PlayerIcons.id(getIconBaseName());

                  ImageView overlayButton = overlayButtonRef.get();
                  if (overlayButton != null) {
                      overlayButton.setImageResource(icon);
                  }

                  if (legacy != null) {
                      legacy.setIcon(icon);
                  }
              }

              private static String getIconName() {
                  return PlayerIcons.name(getIconBaseName());
              }

              private static String getIconBaseName() {
                  return level < 0 ? SYSTEM_ICON : LEVEL_ICONS[level];
              }
          }
          JAVA

          git add -A
          git commit -m "feat(YouTube): Add brightness button levels"
      - name: Test build
        run: ./gradlew :patches:buildAndroid --no-daemon
      - name: Push branch
        run: git push origin brightness-levels-final
