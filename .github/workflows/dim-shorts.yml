name: Dim shorts final
on: workflow_dispatch
permissions:
  contents: write
  packages: read
jobs:
  pick:
    runs-on: ubuntu-latest
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Add the feature
        run: |
          git config user.name "builder"
          git config user.email "builder@users.noreply.github.com"
          printf '%s\n' 'patches/src/main/resources/addresources/values/youtube/strings.xml merge=union' 'extensions/youtube/src/main/java/app/morphe/extension/youtube/settings/Settings.java merge=union' >> .git/info/attributes
          git fetch https://github.com/Nicsilver/morphe-patches.git feat/youtube/dim-shorts-overlay
          git checkout -b dim-shorts-final
          git cherry-pick FETCH_HEAD
      - name: Test build
        run: ./gradlew :patches:buildAndroid --no-daemon
      - name: Push branch
        run: git push origin dim-shorts-final
