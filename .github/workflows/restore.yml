name: Restore working code
on: workflow_dispatch
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore
        run: |
          git config user.name "builder"
          git config user.email "builder@users.noreply.github.com"
          git restore --source=61c9c5f --staged --worktree -- . ':(exclude).github'
          git status --short | head -50
          git commit -m "Restore working code" || echo "nothing to restore"
          git push origin main
