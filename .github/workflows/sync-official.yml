name: Sync official Morphe
on: workflow_dispatch
permissions:
  contents: write
  actions: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Merge official main
        id: merge
        run: |
          git config user.name "builder"
          git config user.email "builder@users.noreply.github.com"
          printf '%s\n' 'patches/src/main/resources/addresources/values/youtube/strings.xml merge=union' 'patches/src/main/resources/addresources/values-tr-rTR/youtube/strings.xml merge=union' >> .git/info/attributes
          git fetch https://github.com/MorpheApp/morphe-patches.git main
          echo "Old main: $(git rev-parse HEAD)"
          git merge --no-commit --no-ff FETCH_HEAD || true
          if [ -z "$(git rev-parse -q --verify MERGE_HEAD)" ]; then
            echo "Already up to date"
            exit 0
          fi
          git rm -rq --cached .github
          git checkout HEAD -- .github
          for f in CHANGELOG.md README.md patches-bundle.json patches-list.json; do
            if git diff --name-only --diff-filter=U | grep -qx "$f"; then
              git checkout --theirs -- "$f"
              git add "$f"
            fi
          done
          LEFT=$(git diff --name-only --diff-filter=U)
          if [ -n "$LEFT" ]; then
            echo "CONFLICT in these files, stopping:"
            echo "$LEFT"
            git merge --abort
            exit 1
          fi
          git commit -m "Sync official Morphe"
          git push origin main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Start Release build
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref main
